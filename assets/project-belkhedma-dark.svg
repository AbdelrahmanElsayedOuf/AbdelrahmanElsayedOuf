<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Belkhedma — Home-services marketplace (Saudi Arabia)"><title>Belkhedma — Home-services marketplace (Saudi Arabia)</title><defs><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9A6FF"/><stop offset="1" stop-color="#8A6CFF"/></linearGradient><linearGradient id="g-peach" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD2B5"/><stop offset="1" stop-color="#FF9F76"/></linearGradient><linearGradient id="g-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A8F0D8"/><stop offset="1" stop-color="#4FCFA6"/></linearGradient><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BFE0FF"/><stop offset="1" stop-color="#6AAEFF"/></linearGradient><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC2D4"/><stop offset="1" stop-color="#FF8FB1"/></linearGradient><linearGradient id="g-sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6A6"/><stop offset="1" stop-color="#FFC94D"/></linearGradient>
  <filter id="clay" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="10" dy="12" stdDeviation="11" flood-color="#000000" flood-opacity=".55"/>
    <feDropShadow dx="-7" dy="-7" stdDeviation="8" flood-color="#4A4180" flood-opacity=".18"/>
  </filter>
  <filter id="clay-sm" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="5" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity=".55"/>
    <feDropShadow dx="-4" dy="-4" stdDeviation="4" flood-color="#4A4180" flood-opacity=".18"/>
  </filter>
  <filter id="inner" x="0" y="0" width="100%" height="100%">
    <feOffset dx="-7" dy="-7" in="SourceAlpha"/><feGaussianBlur stdDeviation="7" result="b1"/>
    <feComposite in="SourceAlpha" in2="b1" operator="out" result="i1"/>
    <feFlood flood-color="#000" flood-opacity=".35"/><feComposite in2="i1" operator="in" result="dark"/>
    <feOffset dx="7" dy="7" in="SourceAlpha"/><feGaussianBlur stdDeviation="7" result="b2"/>
    <feComposite in="SourceAlpha" in2="b2" operator="out" result="i2"/>
    <feFlood flood-color="#fff" flood-opacity=".09"/><feComposite in2="i2" operator="in" result="light"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
  </filter>
</defs>
<style>
  text { font-family: 'Segoe UI', 'Nunito', -apple-system, Helvetica, Arial, sans-serif; }
  .float { animation: f 6s ease-in-out infinite; transform-box: fill-box; }
  .float.d2 { animation-delay: -2s; } .float.d3 { animation-delay: -4s; }
  @keyframes f { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .float { animation: none; } }
</style><g filter="url(#clay)"><rect x="24" y="20" width="552" height="286" rx="36" fill="#2A2549" filter="url(#inner)"/></g><g filter="url(#clay-sm)"><rect x="44" y="40" width="170" height="170" rx="30" fill="url(#g-violet)" filter="url(#inner)"/></g><circle cx="190" cy="62" r="34" fill="#fff" opacity=".22"/><circle cx="70" cy="190" r="20" fill="#fff" opacity=".22"/><g class="float"><path d="M95 126 L129 96 L163 126 V158 H95 Z" fill="#fff" opacity=".95"/><rect x="119" y="134" width="20" height="24" rx="6" fill="#8A6CFF"/></g><text x="240" y="70" font-size="14" font-weight="800" fill="#A48BFF" letter-spacing="1">HOME-SERVICES MARKETPLACE</text><text x="238" y="110" font-size="34" font-weight="800" fill="#F1EEFF">Belkhedma</text><text x="240" y="142" font-size="16" font-weight="600" fill="#B4ADD8">Multi-provider marketplace with</text><text x="240" y="166" font-size="16" font-weight="600" fill="#B4ADD8">escrow payments (HyperPay, Apple Pay)</text><g filter="url(#clay-sm)"><rect x="44" y="228" width="117.6" height="28" rx="14.0" fill="url(#g-sun)" filter="url(#inner)"/></g><text x="102.8" y="246.68" text-anchor="middle" font-size="13" font-weight="700" fill="#2A2547">Saudi Arabia</text><g filter="url(#clay-sm)"><rect x="44" y="266" width="115.6" height="26" rx="13.0" fill="#221E3D" filter="url(#inner)"/></g><text x="101.8" y="283.68" text-anchor="middle" font-size="13" font-weight="700" fill="#F1EEFF">ASP.NET Zero</text><g filter="url(#clay-sm)"><rect x="167.6" y="266" width="76.6" height="26" rx="13.0" fill="#221E3D" filter="url(#inner)"/></g><text x="205.89999999999998" y="283.68" text-anchor="middle" font-size="13" font-weight="700" fill="#F1EEFF">Angular</text><g filter="url(#clay-sm)"><rect x="252.2" y="266" width="76.6" height="26" rx="13.0" fill="#221E3D" filter="url(#inner)"/></g><text x="290.5" y="283.68" text-anchor="middle" font-size="13" font-weight="700" fill="#F1EEFF">Flutter</text><g filter="url(#clay-sm)"><rect x="336.79999999999995" y="266" width="115.6" height="26" rx="13.0" fill="#221E3D" filter="url(#inner)"/></g><text x="394.59999999999997" y="283.68" text-anchor="middle" font-size="13" font-weight="700" fill="#F1EEFF">Dynamics 365</text><g filter="url(#clay-sm)"><rect x="460.4" y="266" width="61.0" height="26" rx="13.0" fill="#221E3D" filter="url(#inner)"/></g><text x="490.9" y="283.68" text-anchor="middle" font-size="13" font-weight="700" fill="#F1EEFF">Redis</text></svg>