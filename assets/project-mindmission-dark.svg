<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Mind Mission — E-learning platform (Egypt, Saudi Arabia)"><title>Mind Mission — E-learning platform (Egypt, Saudi Arabia)</title><defs><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9A6FF"/><stop offset="1" stop-color="#8A6CFF"/></linearGradient><linearGradient id="g-peach" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD2B5"/><stop offset="1" stop-color="#FF9F76"/></linearGradient><linearGradient id="g-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A8F0D8"/><stop offset="1" stop-color="#4FCFA6"/></linearGradient><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BFE0FF"/><stop offset="1" stop-color="#6AAEFF"/></linearGradient><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC2D4"/><stop offset="1" stop-color="#FF8FB1"/></linearGradient><linearGradient id="g-sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6A6"/><stop offset="1" stop-color="#FFC94D"/></linearGradient>
  <filter id="clay" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="10" dy="12" stdDeviation="11" flood-color="#000000" flood-opacity=".55"/>
    <feDropShadow dx="-7" dy="-7" stdDeviation="8" flood-color="#4A4180" flood-opacity=".18"/>
  </filter>
  <filter id="clay-sm" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="5" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity=".55"/>
    <feDropShadow dx="-4" dy="-4" stdDeviation="4" flood-color="#4A4180" flood-opacity=".18"/>
  </filter>
  <filter id="inner" x="0" y="0" width="100%" height="100%">
    <feOffset dx="-7" dy="-7" in="SourceAlpha"/><feGaussianBlur stdDeviation="7" result="b1"/>
    <feComposite in="SourceAlpha" in2="b1" operator="out" result="i1"/>
    <feFlood flood-color="#000" flood-opacity=".35"/><feComposite in2="i1" operator="in" result="dark"/>
    <feOffset dx="7" dy="7" in="SourceAlpha"/><feGaussianBlur stdDeviation="7" result="b2"/>
    <feComposite in="SourceAlpha" in2="b2" operator="out" result="i2"/>
    <feFlood flood-color="#fff" flood-opacity=".09"/><feComposite in2="i2" operator="in" result="light"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
  </filter>
</defs>
<style>
  text { font-family: 'Segoe UI', 'Nunito', -apple-system, Helvetica, Arial, sans-serif; }
  .float { animation: f 6s ease-in-out infinite; transform-box: fill-box; }
  .float.d2 { animation-delay: -2s; } .float.d3 { animation-delay: -4s; }
  @keyframes f { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .float { animation: none; } }
