<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="TPH Emirates — Recruitment platform (UAE)"><title>TPH Emirates — Recruitment platform (UAE)</title><defs><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9A6FF"/><stop offset="1" stop-color="#8A6CFF"/></linearGradient><linearGradient id="g-peach" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD2B5"/><stop offset="1" stop-color="#FF9F76"/></linearGradient><linearGradient id="g-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A8F0D8"/><stop offset="1" stop-color="#4FCFA6"/></linearGradient><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BFE0FF"/><stop offset="1" stop-color="#6AAEFF"/></linearGradient><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC2D4"/><stop offset="1" stop-color="#FF8FB1"/></linearGradient><linearGradient id="g-sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6A6"/><stop offset="1" stop-color="#FFC94D"/></linearGradient>
  <filter id="clay" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="10" dy="12" stdDeviation="11" flood-color="#6252B4" flood-opacity=".22"/>
    <feDropShadow dx="-7" dy="-7" stdDeviation="8" flood-color="#FFFFFF" flood-opacity=".95"/>
  </filter>
  <filter id="clay-sm" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="5" dy="6" stdDeviation="5" flood-color="#6252B4" flood-opacity=".22"/>
    <feDropShadow dx="-4" dy="-4" stdDeviation="4" flood-color="#FFFFFF" flood-opacity=".95"/>
  </filter>
  <filter id="inner" x="0" y="0" width="100%" height="100%">
    <feOffset dx="-7" dy="-7" in="SourceAlpha"/><feGaussianBlur stdDeviation="7" result="b1"/>
    <feComposite in="SourceAlpha" in2="b1" operator="out" result="i1"/>
    <feFlood flood-color="#000" flood-opacity=".14"/><feComposite in2="i1" operator="in" result="dark"/>
    <feOffset dx="7" dy="7" in="SourceAlpha"/><feGaussianBlur stdDeviation="7" result="b2"/>
    <feComposite in="SourceAlpha" in2="b2" operator="out" result="i2"/>
    <feFlood flood-color="#fff" flood-opacity=".55"/><feComposite in2="i2" operator="in" result="light"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
  </filter>
</defs>
<style>
  text { font-family: 'Segoe UI', 'Nunito', -apple-system, Helvetica, Arial, sans-serif; }
  .float { animation: f 6s ease-in-out infinite; transform-box: fill-box; }
  .float.d2 { animation-delay: -2s; } .float.d3 { animation-delay: -4s; }
  @keyframes f { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .float { animation: none; } }
</style><rect width="600" height="330" fill="#EEEAFB"/><g filter="url(#clay)"><rect x="24" y="20" width="552" height="286" rx="36" fill="#F7F5FF" filter="url(#inner)"/></g><g filter="url(#clay-sm)"><rect x="44" y="40" width="170" height="170" rx="30" fill="url(#g-sky)" filter="url(#inner)"/></g><circle cx="190" cy="62" r="34" fill="#fff" opacity=".22"/><circle cx="70" cy="190" r="20" fill="#fff" opacity=".22"/><g class="float"><rect x="93" y="112" width="72" height="50" rx="12" fill="#fff" opacity=".95"/><rect x="115" y="98" width="28" height="18" rx="6" fill="none" stroke="#fff" stroke-width="6"/><rect x="93" y="130" width="72" height="6" fill="#6AAEFF"/></g><text x="240" y="70" font-size="14" font-weight="800" fill="#7C5CFF" letter-spacing="1">RECRUITMENT PLATFORM</text><text x="238" y="110" font-size="34" font-weight="800" fill="#2A2547">TPH Emirates</text><text x="240" y="142" font-size="16" font-weight="600" fill="#645E86">Recruitment portal integrated with</text><text x="240" y="166" font-size="16" font-weight="600" fill="#645E86">Dynamics 365 CRM workflows</text><g filter="url(#clay-sm)"><rect x="44" y="228" width="47.4" height="28" rx="14.0" fill="url(#g-sun)" filter="url(#inner)"/></g><text x="67.7" y="246.68" text-anchor="middle" font-size="13" font-weight="700" fill="#2A2547">UAE</text><g filter="url(#clay-sm)"><rect x="44" y="266" width="115.6" height="26" rx="13.0" fill="#E9E4FA" filter="url(#inner)"/></g><text x="101.8" y="283.68" text-anchor="middle" font-size="13" font-weight="700" fill="#2A2547">.NET Web API</text><g filter="url(#clay-sm)"><rect x="167.6" y="266" width="76.6" height="26" rx="13.0" fill="#E9E4FA" filter="url(#inner)"/></g><text x="205.89999999999998" y="283.68" text-anchor="middle" font-size="13" font-weight="700" fill="#2A2547">Angular</text><g filter="url(#clay-sm)"><rect x="252.2" y="266" width="100.0" height="26" rx="13.0" fill="#E9E4FA" filter="url(#inner)"/></g><text x="302.2" y="283.68" text-anchor="middle" font-size="13" font-weight="700" fill="#2A2547">SQL Server</text><g filter="url(#clay-sm)"><rect x="360.2" y="266" width="115.6" height="26" rx="13.0" fill="#E9E4FA" filter="url(#inner)"/></g><text x="418.0" y="283.68" text-anchor="middle" font-size="13" font-weight="700" fill="#2A2547">Dynamics 365</text></svg>