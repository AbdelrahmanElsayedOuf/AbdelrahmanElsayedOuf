<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="3+ years experience, 3 countries served, 5+ production projects, 1 Microsoft certification"><title>3+ years experience, 3 countries served, 5+ production projects, 1 Microsoft certification</title><defs><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9A6FF"/><stop offset="1" stop-color="#8A6CFF"/></linearGradient><linearGradient id="g-peach" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD2B5"/><stop offset="1" stop-color="#FF9F76"/></linearGradient><linearGradient id="g-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A8F0D8"/><stop offset="1" stop-color="#4FCFA6"/></linearGradient><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BFE0FF"/><stop offset="1" stop-color="#6AAEFF"/></linearGradient><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC2D4"/><stop offset="1" stop-color="#FF8FB1"/></linearGradient><linearGradient id="g-sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6A6"/><stop offset="1" stop-color="#FFC94D"/></linearGradient>
  <filter id="clay" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="10" dy="12" stdDeviation="11" flood-color="#6252B4" flood-opacity=".22"/>
    <feDropShadow dx="-7" dy="-7" stdDeviation="8" flood-color="#FFFFFF" flood-opacity=".95"/>
  </filter>
  <filter id="clay-sm" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="5" dy="6" stdDeviation="5" flood-color="#6252B4" flood-opacity=".22"/>
    <feDropShadow dx="-4" dy="-4" stdDeviation="4" flood-color="#FFFFFF" flood-opacity=".95"/>
  </filter>
  <filter id="inner" x="0" y="0" width="100%" height="100%">
    <feOffset dx="-7" dy="-7" in="SourceAlpha"/><feGaussianBlur stdDeviation="7" result="b1"/>
    <feComposite in="SourceAlpha" in2="b1" operator="out" result="i1"/>
    <feFlood flood-color="#000" flood-opacity=".14"/><feComposite in2="i1" operator="in" result="dark"/>
    <feOffset dx="7" dy="7" in="SourceAlpha"/><feGaussianBlur stdDeviation="7" result="b2"/>
    <feComposite in="SourceAlpha" in2="b2" operator="out" result="i2"/>
    <feFlood flood-color="#fff" flood-opacity=".55"/><feComposite in2="i2" operator="in" result="light"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
  </filter>
</defs>
<style>
  text { font-family: 'Segoe UI', 'Nunito', -apple-system, Helvetica, Arial, sans-serif; }
  .float { animation: f 6s ease-in-out infinite; transform-box: fill-box; }
  .float.d2 { animation-delay: -2s; } .float.d3 { animation-delay: -4s; }
  @keyframes f { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .float { animation: none; } }
</style><rect width="1200" height="170" fill="#EEEAFB"/><g filter="url(#clay)"><rect x="60" y="26" width="255" height="118" rx="30" fill="#F7F5FF" filter="url(#inner)"/></g><g filter="url(#clay-sm)"><rect x="82" y="52" width="66" height="66" rx="22" fill="url(#g-violet)" filter="url(#inner)"/></g><text x="115" y="96" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">3+</text><text x="164" y="80" font-size="15" font-weight="800" fill="#2A2547">Years</text><text x="164" y="102" font-size="15" font-weight="600" fill="#645E86">experience</text><g filter="url(#clay)"><rect x="341" y="26" width="255" height="118" rx="30" fill="#F7F5FF" filter="url(#inner)"/></g><g filter="url(#clay-sm)"><rect x="363" y="52" width="66" height="66" rx="22" fill="url(#g-mint)" filter="url(#inner)"/></g><text x="396" y="96" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">3</text><text x="445" y="80" font-size="15" font-weight="800" fill="#2A2547">Countries</text><text x="445" y="102" font-size="15" font-weight="600" fill="#645E86">served</text><g filter="url(#clay)"><rect x="622" y="26" width="255" height="118" rx="30" fill="#F7F5FF" filter="url(#inner)"/></g><g filter="url(#clay-sm)"><rect x="644" y="52" width="66" height="66" rx="22" fill="url(#g-peach)" filter="url(#inner)"/></g><text x="677" y="96" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">5+</text><text x="726" y="80" font-size="15" font-weight="800" fill="#2A2547">Production</text><text x="726" y="102" font-size="15" font-weight="600" fill="#645E86">projects</text><g filter="url(#clay)"><rect x="903" y="26" width="255" height="118" rx="30" fill="#F7F5FF" filter="url(#inner)"/></g><g filter="url(#clay-sm)"><rect x="925" y="52" width="66" height="66" rx="22" fill="url(#g-sky)" filter="url(#inner)"/></g><text x="958" y="96" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">1</text><text x="1007" y="80" font-size="15" font-weight="800" fill="#2A2547">Microsoft</text><text x="1007" y="102" font-size="15" font-weight="600" fill="#645E86">certification</text></svg>